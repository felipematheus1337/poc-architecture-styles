server:
  port: 8083

spring:
  application:
    name: orders-service

  datasource:
    url: jdbc:postgresql://localhost:5432/sba
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: orders
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: never

  jackson:
    serialization:
      indent_output: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG